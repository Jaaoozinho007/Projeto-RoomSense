
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoramento do Cômodo</title>
    <link rel="stylesheet" href="index.css">
</head>

<!--
    ESTADOS PARA TESTE:

    data-presenca="sim" ou "nao"
    data-fluxo="entrando", "saindo" ou "parado"

    Altere também o número dentro de #contagem.
-->

<body data-presenca="sim" data-fluxo="entrando">

    <main class="container">

        <header>
            <h1>Monitoramento do Cômodo</h1>
            <p>Sistema de controle de presença</p>
        </header>

        <section class="contagem">
            <span class="numero" id="contagem">0</span>
            <p>pessoas no cômodo</p>
        </section>

        <section class="presenca">
            <span class="indicador"></span>

            <span class="texto-presenca estado-sim">
                Cômodo ocupado
            </span>

            <span class="texto-presenca estado-nao">
                Cômodo vazio
            </span>
        </section>

        <section class="movimento">

            <h2>Movimentação na porta</h2>

            <div class="direcao">
                <span>Fora</span>
                <span class="seta">➜</span>
                <span>Dentro</span>
            </div>

            <p class="fluxo fluxo-entrando">
                Alguém está entrando
            </p>

            <p class="fluxo fluxo-saindo">
                Alguém está saindo
            </p>

            <p class="fluxo fluxo-parado">
                Sem movimentação
            </p>

        </section>

        <footer>
            <p>Sistema de Monitoramento • ESP32</p>
        </footer>

    </main>

</body>
</html>
